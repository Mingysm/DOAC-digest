name: DOAC Digest

on:
  schedule:
    # UTC 时间；DOAC 通常周二/周四更新。换算为北京时间 09:00 / 21:00
    - cron: '0 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read        # GitHub Models 免费推理（若用 github provider）

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 缺失时直接装依赖，不让文件遗漏拖垮任务
          pip install -r requirements.txt || pip install requests yt-dlp
          # ffmpeg/yt-dlp 只是兜底手段（官方 transcript 优先），装不上也不让整个任务挂掉
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || echo "warn: ffmpeg install failed, fallback disabled"
          yt-dlp --version >/dev/null 2>&1 || pip install -U yt-dlp || echo "warn: yt-dlp unavailable"

      - name: Run digest
        env:
          # 免费 LLM（任选其一）：
          #  A. 智谱 GLM（推荐，大陆直连，手机号在 open.bigmodel.cn 注册）:
          #    OPENAI_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          #    CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          #    LLM_MODEL: glm-4.7-flash
          #  B. Gemini 免费档: 配 GEMINI_API_KEY
          #  C. Groq 免费档: 配 GROQ_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # LLM_MODEL: glm-4.7-flash      # 用智谱时取消注释；用其他服务时填对应模型 ID
          # LLM_PROVIDER: custom          # 想强制指定时打开
          # YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}  # 旧集走 YouTube 字幕被拦时再配
          # SINCE_DAYS: '7'               # 只处理最近 N 天发布的集
          # MIN_SECS: '1800'              # 过滤掉 < 30 分钟的剪辑片段；设 0 关闭
          # 邮件（必填）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python doac_digest.py --max-new 2 | tee run.log
          exit ${PIPESTATUS[0]}

      - name: Show failure reason
        if: failure()
        run: |
          {
            echo "## ❌ 运行失败，日志最后 40 行如下"
            echo '```'
            tail -40 run.log 2>/dev/null || echo "(run.log 不存在，脚本可能没跑起来，请检查仓库文件是否齐全)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push || echo "nothing to push"
